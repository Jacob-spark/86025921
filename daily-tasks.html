<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>کارهای روزانه</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Tahoma, 'Vazirmatn', sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 24px;
    color: #222;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .date-label { color: #666; font-size: 14px; margin-bottom: 20px; }

  .add-box {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .add-box input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #d7d7d7;
    font-size: 14px;
    background: #fff;
  }
  .add-box button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #2f6fed;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  .add-box button:hover { background: #255ecb; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 14px 16px;
    border: 1px solid #e5e5e5;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card.done { background: #eefbf1; border-color: #bfe9c9; }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card-text {
    font-size: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    flex: 1;
  }
  .card.done .card-text { text-decoration: line-through; color: #777; }
  .card-time { font-size: 11px; color: #999; }
  .card-actions { display: flex; gap: 6px; }
  .icon-btn {
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 15px;
    padding: 2px 4px;
    border-radius: 4px;
    color: #888;
  }
  .icon-btn:hover { background: #f0f0f0; }
  .icon-btn.check { color: #2f9e44; }
  .icon-btn.del { color: #d9480f; }
  .empty {
    text-align: center;
    color: #999;
    padding: 40px 0;
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>کارهای انجام‌شده امروز</h1>
  <div class="date-label" id="dateLabel"></div>

  <div class="add-box">
    <input id="taskInput" type="text" placeholder="کاری که انجام دادی رو بنویس..." />
    <button id="addBtn">افزودن</button>
  </div>

  <div class="cards" id="cardsContainer"></div>
  <div class="empty" id="emptyMsg" style="display:none;">هنوز کاری اضافه نکردی</div>
</div>

<script>
const STORAGE_KEY = 'daily-tasks-entries';
let entries = [];

function todayFa() {
  return new Date().toLocaleDateString('fa-IR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}
document.getElementById('dateLabel').textContent = todayFa();

function timeNow() {
  return new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
}

async function load() {
  try {
    const res = await window.storage.get(STORAGE_KEY, false);
    entries = res && res.value ? JSON.parse(res.value) : [];
  } catch (e) {
    entries = [];
  }
  render();
}

async function save() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(entries), false);
  } catch (e) {
    console.error('storage error', e);
  }
}

function render() {
  const container = document.getElementById('cardsContainer');
  const emptyMsg = document.getElementById('emptyMsg');
  container.innerHTML = '';
  if (entries.length === 0) {
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';

  entries.slice().reverse().forEach((entry) => {
    const card = document.createElement('div');
    card.className = 'card' + (entry.done ? ' done' : '');

    const top = document.createElement('div');
    top.className = 'card-top';

    const text = document.createElement('div');
    text.className = 'card-text';
    text.textContent = entry.text;

    const actions = document.createElement('div');
    actions.className = 'card-actions';

    const checkBtn = document.createElement('button');
    checkBtn.className = 'icon-btn check';
    checkBtn.title = 'انجام شد';
    checkBtn.textContent = entry.done ? '↺' : '✓';
    checkBtn.onclick = () => toggleDone(entry.id);

    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn del';
    delBtn.title = 'حذف';
    delBtn.textContent = '✕';
    delBtn.onclick = () => removeEntry(entry.id);

    actions.appendChild(checkBtn);
    actions.appendChild(delBtn);
    top.appendChild(text);
    top.appendChild(actions);

    const time = document.createElement('div');
    time.className = 'card-time';
    time.textContent = entry.time;

    card.appendChild(top);
    card.appendChild(time);
    container.appendChild(card);
  });
}

function addEntry() {
  const input = document.getElementById('taskInput');
  const val = input.value.trim();
  if (!val) return;
  entries.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    text: val,
    time: timeNow(),
    done: false
  });
  input.value = '';
  save();
  render();
}

function toggleDone(id) {
  const e = entries.find(x => x.id === id);
  if (e) e.done = !e.done;
  save();
  render();
}

function removeEntry(id) {
  entries = entries.filter(x => x.id !== id);
  save();
  render();
}

document.getElementById('addBtn').onclick = addEntry;
document.getElementById('taskInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addEntry();
});

load();
</script>
</body>
</html>
